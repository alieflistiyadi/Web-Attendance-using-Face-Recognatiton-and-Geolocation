name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend Assets
        run: |
          npm install
          npm run build

      - name: Sync code & install dependencies on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts
            php artisan package:discover --ansi

      - name: Upload built assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "public/build/"
          target: "${{ secrets.PROJECT_PATH }}/public/build"
          strip_components: 2

      - name: Finalize deploy (cache & migrate)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache || true
            php artisan view:cache
            php artisan migrate --force

            rm -rf ../public_html/*
            rm -rf ../public_html/.[!.]*

            cp -a public/. ../public_html/

            sed -i "s|__DIR__.'/../storage|__DIR__.'/../laravel/storage|g" ../public_html/index.php
            sed -i "s|__DIR__.'/../vendor|__DIR__.'/../laravel/vendor|g" ../public_html/index.php
            sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../laravel/bootstrap|g" ../public_html/index.php

            chmod -R 755 ../public_html
            chmod -R 775 storage
            chmod -R 775 bootstrap/cache
